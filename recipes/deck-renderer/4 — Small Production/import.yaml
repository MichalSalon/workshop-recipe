# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# Small Production = entry prod (~5 users). Platform defaults for
# containers and app autoscaling. oltp-staging Postgres, staging Valkey.
# Value store only at project level.

project:
  name: deck-renderer-small-prod
  envVariables:
    APP_URL: https://frontend-${zeropsSubdomainHost}.prg1.zerops.app
    API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app

services:
  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true

  - hostname: api
    type: nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true

  - hostname: worker
    type: nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe

  - hostname: db
    type: postgresql:single@17
    profile: oltp-staging
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    profile: staging
    priority: 10

  - hostname: queue
    type: nats:single@2.12
    priority: 10
