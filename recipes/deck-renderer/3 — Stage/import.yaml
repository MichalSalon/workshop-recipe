# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# Stage — production setups, one container each, hobby Postgres so the
# rehearsal tier stays cheaper than Small Production.

project:
  name: deck-renderer-stage
  envVariables:
    APP_URL: https://frontend-${zeropsSubdomainHost}.prg1.zerops.app
    API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app

services:
  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  - hostname: api
    type: nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  - hostname: worker
    type: nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5

  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    priority: 10

  - hostname: queue
    type: nats:single@2.12
    priority: 10
