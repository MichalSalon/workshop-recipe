# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# AI agent env — zcp workspace plus dev/stage pairs for frontend, api,
# and worker. Project envVariables are a value store; zerops.yaml maps
# them to VITE_API_URL and CORS. No envVariables on service blocks.

project:
  name: deck-renderer-agent
  envVariables:
    APP_URL: https://frontend-${zeropsSubdomainHost}.prg1.zerops.app
    API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_APP_URL: https://frontenddev-${zeropsSubdomainHost}-5173.prg1.zerops.app
    DEV_API_URL: https://apidev-${zeropsSubdomainHost}-3000.prg1.zerops.app

services:
  # Agent workspace — Browser VS Code + Zerops MCP. App code runs on
  # the frontend/api/worker hostnames, not here.
  - hostname: zcp
    type: zcp@1
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5

  - hostname: frontenddev
    type: nodejs@22
    zeropsSetup: frontend-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  - hostname: apidev
    type: nodejs@22
    zeropsSetup: api-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # Chromium lives in run.prepareCommands — needs the Ubuntu worker-dev
  # setup, not a process-only app container.
  - hostname: workerdev
    type: nodejs@22
    zeropsSetup: worker-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5

  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  - hostname: api
    type: nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  - hostname: worker
    type: nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5

  # Priority 10 starts data stores before the API and worker connect.
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    priority: 10

  - hostname: queue
    type: nats:single@2.12
    priority: 10
