# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
#
# Monorepo pipeline — one file, six app setups + logquery.
# import.yaml zeropsSetup names must match these setup: keys.
# Project value store (APP_URL, API_URL) is mapped here; do not
# redeclare those keys under the same name (self-shadow).

zerops:
  # ── frontend (prod) ─────────────────────────────────────────
  # Vite build on Node, Nginx runtime. VITE_* is baked in at
  # build time from the project value store.
  - setup: frontend
    build:
      base: nodejs@22
      envVariables:
        VITE_API_URL: ${API_URL}
      buildCommands:
        - npm ci
        - npm run build -w @deck/frontend
      # Strip apps/frontend/dist so index.html is the Nginx root.
      deployFiles:
        - apps/frontend/dist/~
      cache:
        - node_modules
    run:
      base: static

  # ── frontend-dev ────────────────────────────────────────────
  # Full tree + Node so the agent can `npm run dev` over SSH.
  - setup: frontend-dev
    build:
      base: nodejs@22
      os: ubuntu
      envVariables:
        VITE_API_URL: ${DEV_API_URL}
      buildCommands:
        - npm install
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 5173
          httpSupport: true
      envVariables:
        VITE_API_URL: ${DEV_API_URL}
      start: zsc noop --silent

  # ── api (prod) ──────────────────────────────────────────────
  # REST + WebSocket. Talks to db, queue, and cache by hostname.
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
      # Workspace packages are linked from the repo root — deploy
      # the tree, not a single app folder.
      deployFiles: ./
      cache:
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: nodejs@22
      # One migrator per deploy version. Worker also runs IF NOT
      # EXISTS on boot; execOnce keeps the first-deploy race off
      # the request path.
      initCommands:
        - zsc execOnce ${appVersionId}-api-migrate --retryUntilSuccessful -- npm run migrate -w @deck/api
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        HOST: 0.0.0.0
        DATABASE_URL: ${db_connectionString}
        VALKEY_URL: ${cache_connectionString}
        # Discrete NATS fields — nats.js treats extra colons in a
        # connection string as IPv6 and rejects generated passwords.
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}
      start: npm run start -w @deck/api
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  # ── api-dev ─────────────────────────────────────────────────
  - setup: api-dev
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - npm install
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      os: ubuntu
      initCommands:
        - zsc execOnce ${appVersionId}-apidev-migrate --retryUntilSuccessful -- npm run migrate -w @deck/api
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: development
        PORT: "3000"
        HOST: 0.0.0.0
        # CORS origin for the Vite slot — value-store key, not a self-ref.
        APP_URL: ${DEV_APP_URL}
        DATABASE_URL: ${db_connectionString}
        VALKEY_URL: ${cache_connectionString}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}
      start: zsc noop --silent

  # ── worker (prod) ───────────────────────────────────────────
  # CPU-bound Chromium. No public HTTP. System packages live in
  # run.prepareCommands — that is why this is a system container.
  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      os: ubuntu
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends chromium fonts-liberation fonts-noto-core
      envVariables:
        NODE_ENV: production
        RENDER_DRIVER: chromium
        CHROMIUM_PATH: /usr/bin/chromium
        DATABASE_URL: ${db_connectionString}
        VALKEY_URL: ${cache_connectionString}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}
      start: npm run start -w @deck/worker

  # ── worker-dev ──────────────────────────────────────────────
  - setup: worker-dev
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - npm install
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      os: ubuntu
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends chromium fonts-liberation fonts-noto-core
      envVariables:
        NODE_ENV: development
        RENDER_DRIVER: chromium
        CHROMIUM_PATH: /usr/bin/chromium
        DATABASE_URL: ${db_connectionString}
        VALKEY_URL: ${cache_connectionString}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}
      start: zsc noop --silent

  # ── logquery (workshop-logs only) ───────────────────────────
  # Read-only HTTPS API. Token comes from the logs project store.
  - setup: logquery
    build:
      base: nodejs@22
      buildCommands:
        - echo "logquery has no npm dependencies"
      deployFiles:
        - workshop/logs/logquery/~
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: "3000"
        HOST: 0.0.0.0
        ELASTICSEARCH_URL: ${elkstorage_connectionString}
        LOG_QUERY_TOKEN: ${LOG_QUERY_TOKEN}
      start: node src/index.js
      healthCheck:
        httpGet:
          port: 3000
          path: /health
