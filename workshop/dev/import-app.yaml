# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# Optional service-import into an existing workshop-dev project.
# workshop/dev/import.yaml creates zcp only; this file adds the app
# topology the agent would otherwise provision live.
# zeropsSetup names match zerops.yaml in the repo root.
#
# Workshop prompt #1: same hostnames as recipes/deck-renderer/0 — AI Agent,
# but prod slots + db are over-provisioned (3 replicas, staging Postgres).
# Attendees right-size to the recipe — do not remove frontend/api/worker.
#
# No URL value store — zerops.yaml resolves public URLs from
# ${hostname_zeropsSubdomain} on these hostnames.

services:
  - hostname: frontenddev
    type: ubuntu/nodejs@22
    zeropsSetup: frontend-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  - hostname: apidev
    type: ubuntu/nodejs@22
    zeropsSetup: api-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    priority: 5
    verticalAutoscaling:
      minRam: 0.5

  - hostname: workerdev
    type: ubuntu/nodejs@22
    zeropsSetup: worker-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    minContainers: 3
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.5

  - hostname: api
    type: ubuntu/nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    priority: 5
    minContainers: 3
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5

  - hostname: worker
    type: ubuntu/nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    minContainers: 3
    verticalAutoscaling:
      minRam: 2
      minFreeRamGB: 1
      minDisk: 2

  - hostname: db
    type: postgresql:ha@17
    profile: oltp-staging
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    priority: 10

  - hostname: queue
    type: nats:single@2.12
    priority: 10
