#yamlPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# workshop-dev starts with zcp only. The on-stage agent provisions frontend,
# api, worker, db, queue, and cache into this project at runtime.
#
# Public URLs are not stored here — zerops.yaml derives them from
# ${hostname_zeropsSubdomain}. Do not put framework keys on services.
project:
  name: workshop-dev

services:
  # Agent workspace — Browser VS Code + Zerops MCP. Single-project token.
  # App code never runs here; the agent creates the other hostnames live.
  - hostname: zcp
    type: zcp@1
    # No pipeline targets this service, so without startWithoutCode it
    # waits for a first deploy that never comes and never boots.
    startWithoutCode: true
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
