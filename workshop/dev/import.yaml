#yamlPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# workshop-dev starts with zcp only. The on-stage agent provisions frontend,
# api, worker, db, queue, and cache into this project at runtime.
#
# Fill LOG_QUERY_URL after workshop-logs is imported (public logquery URL).
# LOG_QUERY_TOKEN must match the token generated on workshop-logs.
# APP_URL / API_URL are the value store; zerops.yaml maps them into
# VITE_API_URL and CORS. Do not put framework keys on services.
project:
  name: workshop-dev
  envVariables:
    LOG_QUERY_URL: https://logquery-REPLACE_ME.prg1.zerops.app
    APP_URL: https://frontend-${zeropsSubdomainHost}.prg1.zerops.app
    API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_APP_URL: https://frontenddev-${zeropsSubdomainHost}-5173.prg1.zerops.app
    DEV_API_URL: https://apidev-${zeropsSubdomainHost}-3000.prg1.zerops.app
  envSecrets:
    LOG_QUERY_TOKEN: REPLACE_WITH_WORKSHOP_LOGS_TOKEN

services:
  # Agent workspace — Browser VS Code + Zerops MCP. Single-project token.
  # App code never runs here; the agent creates the other hostnames live.
  - hostname: zcp
    type: zcp@1
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
