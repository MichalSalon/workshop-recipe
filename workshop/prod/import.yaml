# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# workshop-prod — HA topology, no zcp. CI deploys repo-root zerops.yaml
# (setups: frontend, api, worker). Public URLs resolve from
# ${hostname_zeropsSubdomain} in zerops.yaml — nothing region-specific here.
project:
  name: workshop-prod
  corePackage: SERIOUS

services:
  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    minContainers: 3
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  - hostname: api
    type: ubuntu/nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before the SPA so ${api_zeropsSubdomain}
    # already carries its -3000 port when the SPA builds.
    priority: 5
    minContainers: 3
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # CPU-bound Chromium. Three replicas is the prod floor; scale is the point.
  - hostname: worker
    type: ubuntu/nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    minContainers: 3
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  - hostname: db
    type: postgresql:ha@17
    profile: oltp-staging
    priority: 10

  - hostname: cache
    type: valkey:ha@7.2
    priority: 10

  - hostname: queue
    type: nats:ha@2.12
    priority: 10
