# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# workshop-prod — HA topology, no zcp. CI deploys repo-root zerops.yaml
# (setups: frontend, api, worker). Project envVariables are a value store;
# zerops.yaml maps APP_URL / API_URL into Vite and CORS.
project:
  name: workshop-prod
  corePackage: SERIOUS
  envVariables:
    APP_URL: https://frontend-${zeropsSubdomainHost}.prg1.zerops.app
    API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app

services:
  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    minContainers: 3
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  - hostname: api
    type: nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    minContainers: 3
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # CPU-bound Chromium. Three replicas is the prod floor; scale is the point.
  - hostname: worker
    type: nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    minContainers: 3
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  - hostname: db
    type: postgresql:ha@17
    profile: oltp-staging
    priority: 10

  - hostname: cache
    type: valkey:ha@7.2
    priority: 10

  - hostname: queue
    type: nats:ha@2.12
    priority: 10
