#yamlPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# Central log project — imported weeks before the workshop and left alone.
# Dev and prod sit on other VXLANs; they reach this stack only through the
# public logquery URL + bearer token, never elkstorage:9200.
project:
  name: workshop-logs
  envVariables:
    APP_URL: https://kibana-${zeropsSubdomainHost}.prg1.zerops.app
    API_URL: https://logquery-${zeropsSubdomainHost}-3000.prg1.zerops.app
  envSecrets:
    LOG_QUERY_TOKEN: <@generateRandomString(<48>)>

services:
  # Elasticsearch holds forwarded project logs. Priority 10 so Kibana and
  # logquery do not boot against an empty hostname.
  - hostname: elkstorage
    type: elasticsearch:single@8.16
    priority: 10

  - hostname: kibana
    type: ubuntu@24.04
    buildFromGit: https://github.com/zerops-recipe-apps/elk-kibana-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.75
    # Kibana is not a horizontally scaled role in this recipe.
    maxContainers: 1

  # HTTP intake for Zerops project log-forwarding from workshop-dev and
  # workshop-prod. Public so the other projects can reach it across VXLANs.
  - hostname: logstash
    type: ubuntu@24.04
    buildFromGit: https://github.com/zerops-recipe-apps/elk-logstash-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.625

  # Read-only query API the on-stage agent calls. Bearer = project
  # LOG_QUERY_TOKEN. Filters by service hostname (frontend, api, worker).
  - hostname: logquery
    type: nodejs@22
    zeropsSetup: logquery
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25
